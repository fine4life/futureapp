name: futureapp CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore futureapp.sln

      - name: Build application
        run: dotnet build futureapp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test futureapp.sln --configuration Release --no-build
