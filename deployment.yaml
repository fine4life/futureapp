apiVersion: apps/v1
kind: Deployment
metadata:
  name: futureapp
  namespace: futureapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: futureapp
  template:
    metadata:
      labels:
        app: futureapp
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: futureapp
          image: FUTUREAPP_IMAGE
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256M
